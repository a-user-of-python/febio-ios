name: Build FEBio Studio IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Studio/**"
      - ".github/workflows/build-studio.yml"

jobs:
  build:
    name: FEBio Studio unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile FEBio Studio for iOS arm64
        run: bash Studio/Scripts/build-studio-ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FEBioStudio-unsigned
          path: FEBioStudio-unsigned.ipa
